[package]
name = "cat-desktop"
description = "CAT: Coral Annotation Tool - native Windows desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "CAT"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
cat-cog = { path = "../crates/cat-cog" }
cat-core = { path = "../crates/cat-core" }
cat-api = { path = "../crates/cat-api" }
earcutr = "0.5"
rfd = "0.18"
egui_extras = "0.37"
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
lru = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "http2", "query"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
