[package]
name = "cat-api"
description = "Client for the CAT server API (auth, projects, annotations sync)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "http2", "json", "query"] }
cat-core = { path = "../cat-core" }

