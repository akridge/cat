[workspace]
resolver = "2"
members = ["crates/*", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Decoders are hot paths; keep them fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3
